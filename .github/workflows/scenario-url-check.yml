name: Scenario URL check

# Checks every URL in agents/prompts/scenarios and keeps one open GitHub issue
# with the latest report. GitHub emails the assignees and anyone watching the
# repo when the issue is opened or gets a new comment.
#
# - Failures found, no open issue  -> open a new issue
# - Failures found, issue open     -> replace the issue body, add a comment
# - All passing, issue open        -> comment and close the issue
#
# Assignees come from the repo variable URL_CHECK_ASSIGNEES
# (comma-separated GitHub usernames). Leave it unset to assign no one.
#
# Report-only: this workflow never edits files under agents/prompts/.

on:
  schedule:
    - cron: '0 12 * * 1' # Mondays, 12:00 UTC (8:00 Eastern daylight time)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: scenario-url-check
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'cds-snc/ai-answers'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check URLs
        id: check
        run: |
          set +e
          node .claude/skills/check-urls/scripts/check-urls.mjs agents/prompts/scenarios --output url-report.md
          code=$?
          if [ "$code" -gt 1 ]; then exit "$code"; fi # 2 = script error, fail the run
          echo "failed=$code" >> "$GITHUB_OUTPUT"

      - name: Open, update or close the report issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          FAILED: ${{ steps.check.outputs.failed }}
          ASSIGNEES: ${{ vars.URL_CHECK_ASSIGNEES }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Scenario URL check report"

          # Issue bodies are capped at 65,536 characters.
          {
            head -c 55000 url-report.md
            if [ "$(wc -c < url-report.md)" -gt 55000 ]; then
              printf '\n\n_Report truncated. Download the full report from the workflow run._\n'
            fi
            printf '\n---\nGenerated by [this workflow run](%s).\n\n' "$RUN_URL"
            cat <<'EOF'
          <details>
          <summary>About this check</summary>

          ### What it checks

          Every URL in `agents/prompts/scenarios`. Nothing else in the repo is checked.

          - **Broken**: 4xx/5xx errors, timeouts, SSL or DNS errors, and redirects to an error page (Canada.ca sends dead pages to `/errors/404.html` with a 302 instead of returning a 404).
          - **Redirects**: any other 3xx. Listed URLs should be live pages, so a redirect counts as a failure. The destination is usually the replacement.
          - **Language switches**: a redirect to the page the URL itself names (for example `set-lang?from=/accueil` to `/accueil`), or to the same URL with only a language parameter removed. That one redirect is allowed, but the destination is still checked. URLs that just include `lang=` are checked normally.

          A URL that fails is retried twice (after 3 and 10 seconds) and only reported if every attempt fails. A 403 or a timeout can mean the site blocks automated requests, so check it in a browser before treating it as dead.

          ### How this issue works

          - It runs every Monday at 12:00 UTC. To run it now, go to **Actions > Scenario URL check > Run workflow**.
          - When failures are found, this description is replaced with the latest report and a comment is added. The comment is what sends the email notification.
          - When everything passes, the issue is closed. A new issue opens the next time something fails.
          - The full report is attached to each workflow run as the `url-report` file.

          ### Who gets notified

          The people listed in the repo variable `URL_CHECK_ASSIGNEES` (comma-separated GitHub usernames) are assigned when the issue opens. Change it under **Settings > Secrets and variables > Actions > Variables**. Anyone watching the repo is also notified.

          ### Skipping a URL

          Add a pattern to `.urlcheck-ignore` at the repo root: one per line, `#` for comments, `*` as a wildcard, otherwise a substring match.

          ### Fixing URLs

          Scenario files under `agents/prompts/` are owned by the prompt maintainers. Check with them before changing a URL.

          ### Checking locally

          Run `/check-urls` in Claude Code, or:

          `node .claude/skills/check-urls/scripts/check-urls.mjs agents/prompts/scenarios --output url-report.md`

          </details>
          EOF
          } > issue-body.md

          SUMMARY=$(grep -E '^- (Checked|Broken|Redirects):' url-report.md | tr '\n' ' ')

          ISSUE=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)

          if [ "$FAILED" = "1" ]; then
            if [ -n "$ISSUE" ]; then
              gh issue edit "$ISSUE" --body-file issue-body.md
              gh issue comment "$ISSUE" --body "New report ($(date -u +%F)): $SUMMARY [Workflow run]($RUN_URL)"
            else
              args=(--title "$TITLE" --body-file issue-body.md)
              if [ -n "$ASSIGNEES" ]; then args+=(--assignee "$ASSIGNEES"); fi
              gh issue create "${args[@]}"
            fi
          elif [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body "All scenario URLs pass as of $(date -u +%F). Closing. [Workflow run]($RUN_URL)"
            gh issue close "$ISSUE"
          else
            echo "All URLs pass and no report issue is open. Nothing to do."
          fi

      - name: Upload full report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: url-report
          path: url-report.md
          if-no-files-found: ignore
